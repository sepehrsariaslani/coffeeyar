<!DOCTYPE html>
<html lang="fa" dir="rtl" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <title>{{ boot.store_name or "فروشگاه" }}</title>
  <meta name="description" content="فروشگاه مینیمال با پرداخت آنلاین" />
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />

  <style>
    body {
      margin: 0;
      background: #ffffff;
      color: #222;
      font-family: "Vazirmatn", Tahoma, sans-serif;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      letter-spacing: 0;
      color: #444;
    }

    #loading-screen.fade-out {
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
    }
  </style>

  <script type="module" crossorigin src="/assets/coffeeyar/frontend/assets/index-DY0q-1or.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/coffeeyar/frontend/assets/index-UNbjjUvm.css" />
</head>
<body>
  <div id="loading-screen">{{ boot.store_name or "فروشگاه" }}</div>
  <div id="app"></div>

  <script>
    {% for key in boot %}
    window["{{ key }}"] = {{ boot[key] | tojson }};
    {% endfor %}

    window.addEventListener("load", function () {
      var loading = document.getElementById("loading-screen");
      if (!loading) return;
      loading.classList.add("fade-out");
      setTimeout(function () {
        loading.remove();
      }, 260);
    });
  </script>
</body>
</html>
